<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sub Manager Pro | NXR4 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad: linear-gradient(45deg, #0f172a, #1e1b4b, #312e81);
            --card-grad: linear-gradient(135deg, rgba(37, 99, 235, 0.3), rgba(30, 58, 138, 0.5));
            --glass-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
        }

        .light-mode {
            --bg-grad: linear-gradient(45deg, #f8fafc, #e2e8f0, #cbd5e1);
            --card-grad: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --text-main: #1e293b;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh;
            transition: all 0.5s ease;
            display: flex;
            flex-direction: column;
        }

        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* فوتر الحقوق الأسود الفخم */
        .nxr-footer {
            background: #000000;
            border-top: 2px solid #1a1a1a;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .credit-card { 
            background: var(--card-grad);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        #adOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .drawer { 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateX(100%); 
            position: fixed; top: 0; right: 0; bottom: 0; 
            width: 80%; max-width: 320px; z-index: 2000; 
        }
        .drawer.active { transform: translateX(0); }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }

        .modal { display: none; position: fixed; inset: 0; z-index: 3000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal.active { display: flex; }

        .nav-chip.active { background: #3b82f6 !important; color: white !important; }
        .icon-theme { width: 26px; height: 26px; transition: 0.5s; }
        
        .pulse-blue { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body class="pb-24">

    <div id="adOverlay">
        <div class="p-4 bg-white/10 rounded-xl mb-4 text-[10px] cursor-pointer" onclick="closeAd()">إغلاق الإعلان [x]</div>
        <div class="w-72 h-96 bg-zinc-900 border border-white/10 rounded-3xl flex items-center justify-center text-gray-500 font-bold">AdMob Ad Space</div>
    </div>

    <div id="overlay" class="overlay" onclick="toggleDrawer()"></div>

    <div class="p-6 flex justify-between items-center relative z-10">
        <button onclick="toggleDrawer()" class="p-3 glass-panel rounded-2xl active:scale-90 transition">
            <img src="https://cdn-icons-png.flaticon.com/512/8166/8166544.png" class="w-6 h-6 invert" id="iconMenu">
        </button>
        <h1 class="text-xl font-black tracking-widest text-blue-500 uppercase">Sub Manager</h1>
        <button onclick="toggleTheme()" class="p-3 glass-panel rounded-2xl active:scale-90 transition" id="themeBtn">
            <img id="themeIcon" src="https://cdn-icons-png.flaticon.com/512/180/180700.png" class="icon-theme invert">
        </button>
    </div>

    <div class="max-w-md mx-auto px-6 flex-1 w-full">
        <div id="mainCard" class="credit-card rounded-[2.5rem] p-8 text-white mb-8 relative overflow-hidden transition-all duration-500">
            <div class="flex justify-between items-start mb-10">
                <div>
                    <p class="text-blue-200 text-[10px] font-bold mb-1 uppercase tracking-widest">إجمالي المصروفات</p>
                    <h2 id="totalDisplay" class="text-4xl font-black italic">0</h2>
                </div>
                <img src="https://cdn-icons-png.flaticon.com/512/9334/9334611.png" class="w-12 opacity-80">
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-[9px] opacity-60 uppercase mb-1 font-bold">الميزانية: <span id="budgetView">∞</span></p>
                    <div class="flex -space-x-2">
                        <div class="w-7 h-7 rounded-full bg-blue-500 border-2 border-black/20"></div>
                        <div class="w-7 h-7 rounded-full bg-indigo-700 border-2 border-black/20"></div>
                    </div>
                </div>
                <div class="text-right italic font-black text-[10px] opacity-30">NXR4</div>
            </div>
        </div>

        <div class="flex gap-2 mb-6">
            <button onclick="switchView('list')" class="nav-chip active flex-1 py-3 glass-panel rounded-2xl text-[10px] font-bold uppercase tracking-tighter">Subscriptions</button>
            <button onclick="switchView('stats')" class="nav-chip flex-1 py-3 glass-panel rounded-2xl text-[10px] font-bold uppercase tracking-tighter">Analysis</button>
            <button onclick="switchView('archive')" class="nav-chip flex-1 py-3 glass-panel rounded-2xl text-[10px] font-bold uppercase tracking-tighter">Archive</button>
        </div>

        <div id="listSection" class="view-content space-y-4">
            <div id="subList" class="space-y-4"></div>
        </div>
        <div id="statsSection" class="view-content hidden"><div class="glass-panel p-6 rounded-[2.5rem] space-y-4" id="statsContent"></div></div>
        <div id="archiveSection" class="view-content hidden"><div id="archiveList" class="space-y-3"></div></div>
    </div>

    <footer class="nxr-footer w-full p-6 mt-6">
        <div class="flex flex-col items-center justify-center">
            <p class="text-[8px] font-bold text-gray-500 uppercase tracking-[0.4em] mb-2">Developed & Secured by</p>
            <div class="flex items-center gap-4">
                <span class="text-2xl font-black tracking-tighter text-white">NXR<span class="text-blue-600 italic">4</span></span>
                <div class="w-2.5 h-2.5 rounded-full bg-blue-600 pulse-blue"></div>
            </div>
            <p class="text-[7px] text-gray-600 mt-2 uppercase font-bold italic">Private Server Edition 2026</p>
        </div>
    </footer>

    <div id="drawer" class="drawer glass-panel p-8">
        <h2 class="text-xl font-black text-blue-500 mb-8 uppercase tracking-widest">Settings</h2>
        <div class="space-y-6">
            <input type="number" id="budgetInput" onchange="updateBudget()" placeholder="Set Monthly Budget..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none">
            <select id="currencySelect" onchange="changeCurrency()" class="w-full bg-white/10 border border-white/10 p-4 rounded-2xl outline-none font-bold">
                <option value="SAR" class="text-black">SAR - ريال سعودي</option>
                <option value="USD" class="text-black">USD - دولار أمريكي</option>
                <option value="EGP" class="text-black">EGP - جنيه مصري</option>
            </select>
            <button onclick="openModal()" class="w-full p-5 rounded-2xl bg-blue-600 font-black text-white">➕ ADD NEW SUB</button>
        </div>
    </div>

    <div id="addModal" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 border border-white/20">
            <h3 class="text-xl font-black text-center mb-8 italic">SUBSCRIPTION</h3>
            <div class="space-y-4">
                <input type="text" id="subName" placeholder="Service Name" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none">
                <input type="number" id="subPrice" placeholder="Price" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none">
                <select id="subType" class="w-full bg-white/10 border border-white/10 p-4 rounded-2xl outline-none font-bold">
                    <option value="monthly" class="text-black">Monthly</option>
                    <option value="annual" class="text-black">Annual</option>
                </select>
                <button onclick="saveSub()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black mt-4">SAVE & SHOW AD</button>
                <button onclick="closeModal()" class="w-full text-gray-500 text-xs text-center block mt-2">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const knownLogos = {
           'netflix': 'https://cdn-icons-png.flaticon.com/512/5977/5977590.png',
            'spotify': 'https://cdn-icons-png.flaticon.com/512/2111/2111624.png',
            'tiktok': 'https://cdn-icons-png.flaticon.com/512/3046/3046121.png',
            'youtube': 'https://cdn-icons-png.flaticon.com/512/174/174883.png',
            'apple': 'https://img.icons8.com/?size=48&id=81TSi6Gqk0tm&format=png',
            'amazon': 'https://cdn-icons-png.flaticon.com/512/5968/5968202.png',
            'discord': 'https://cdn-icons-png.flaticon.com/128/3670/3670157.png',
            'snapchat': 'https://cdn-icons-png.flaticon.com/128/15707/15707784.png',
            'chatgpt': 'https://cdn-icons-png.flaticon.com/128/12222/12222560.png',
            'gemini': 'https://img.icons8.com/?size=48&id=mrNoLXFmvXDX&format=png',
            'claude': 'https://img.icons8.com/?size=48&id=zQjzFjPpT2Ek&format=png',
            'amazone prime': 'https://img.icons8.com/?size=48&id=EHtqS186HLz5&format=png',
            'amazon prime video': 'https://img.icons8.com/?size=48&id=mJTj7Q9EPSVn&format=png',
            'disney': 'https://img.icons8.com/?size=48&id=o7YMV0TFYOgR&format=png',
            'cloudflare': 'https://img.icons8.com/?size=80&id=fUGx53gD9Jof&format=png',
            'adobe creative cloud': 'https://img.icons8.com/?size=48&id=Lq5kMukvoW5c&format=png',
            'crunchyroll': 'https://img.icons8.com/?size=48&id=zoSCFf_pSWUE&format=png',
            'deezer': 'https://cdn-icons-png.flaticon.com/128/5968/5968821.png',
            'hbo max': 'https://img.icons8.com/?size=50&id=9tVdlpWe1F9k&format=png',
            'dropbox': 'https://img.icons8.com/?size=48&id=13657&format=png',
            'duolingo': 'https://img.icons8.com/?size=48&id=jJS472JMXlsE&format=png',
            'rave': 'https://img.icons8.com/?size=50&id=FDehNjzhkWzO&format=png',
            'kick': 'https://pnghdpro.com/wp-content/themes/pnghdpro/download/social-media-and-brands/kick-app-icon.png',
            'nord vpn': 'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/nordvpn-icon.png',
            'perplexity': 'https://img.icons8.com/?size=50&id=5WrDC03cg9ua&format=png',
            'express vpn': 'https://img.icons8.com/?size=48&id=EYvWm4GHpQwc&format=png'
        };

        function showInterstitialAd() { document.getElementById('adOverlay').style.display = 'flex'; }
        function closeAd() { document.getElementById('adOverlay').style.display = 'none'; }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('themeIcon');
            icon.src = isLight ? "https://cdn-icons-png.flaticon.com/512/11252/11252119.png" : "https://cdn-icons-png.flaticon.com/512/180/180700.png";
            if(!isLight) icon.classList.add('invert'); else icon.classList.remove('invert');
        }

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function openModal() { document.getElementById('addModal').classList.add('active'); toggleDrawer(); }
        function closeModal() { document.getElementById('addModal').classList.remove('active'); }

        function switchView(view) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-chip').forEach(c => c.classList.remove('active'));
            document.getElementById(view + 'Section').classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }

        function displaySubs() {
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            const archive = JSON.parse(localStorage.getItem('myArchive') || '[]');
            const currency = localStorage.getItem('userCurrency') || 'SAR';
            const budget = parseFloat(localStorage.getItem('userBudget') || 0);
            const listDiv = document.getElementById('subList');
            const archiveDiv = document.getElementById('archiveList');
            let total = 0;

            listDiv.innerHTML = ''; archiveDiv.innerHTML = '';
            subs.forEach((sub, index) => {
                const mPrice = sub.type === 'annual' ? (sub.price / 12) : parseFloat(sub.price);
                total += mPrice;
                const logo = knownLogos[sub.name.toLowerCase().trim()];
                listDiv.innerHTML += `
                    <div class="glass-panel p-5 rounded-[2rem] flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center p-2">
                                ${logo ? `<img src="${logo}" class="w-full h-full object-contain">` : `<span class="opacity-30 uppercase font-black">${sub.name.charAt(0)}</span>`}
                            </div>
                            <div><h4 class="font-bold text-sm">${sub.name}</h4><p class="text-[10px] text-blue-500 font-bold">${mPrice.toFixed(2)} ${currency}</p></div>
                        </div>
                        <button onclick="moveToArchive(${index})" class="p-2 bg-green-500/10 rounded-xl text-[10px] text-green-500 font-bold px-4">Paid</button>
                    </div>`;
            });

            archive.forEach(i => archiveDiv.innerHTML += `<div class="glass-panel p-4 rounded-2xl flex justify-between opacity-30 text-xs italic"><span>${i.name}</span><span>${i.price}</span></div>`);
            document.getElementById('totalDisplay').innerText = total.toFixed(0);
            if(budget > 0) document.getElementById('budgetView').innerText = `${budget} ${currency}`;
            updateStats(subs, total);
        }

        function saveSub() {
            const name = document.getElementById('subName').value;
            const price = document.getElementById('subPrice').value;
            if(!name || !price) return;
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            subs.push({ name, price, type: document.getElementById('subType').value });
            localStorage.setItem('mySubs', JSON.stringify(subs));
            closeModal(); displaySubs();
            confetti({ particleCount: 150, origin: { y: 0.8 } });
            showInterstitialAd();
        }

        function moveToArchive(i) {
            let subs = JSON.parse(localStorage.getItem('mySubs'));
            let archive = JSON.parse(localStorage.getItem('myArchive') || '[]');
            archive.unshift(subs[i]);
            subs.splice(i, 1);
            localStorage.setItem('mySubs', JSON.stringify(subs));
            localStorage.setItem('myArchive', JSON.stringify(archive));
            displaySubs();
        }

        function updateStats(subs, total) {
            const content = document.getElementById('statsContent');
            content.innerHTML = subs.map(s => {
                const p = ( (s.type === 'annual' ? s.price/12 : s.price) / total * 100).toFixed(0);
                return `<div class="space-y-1"><div class="flex justify-between text-[8px] font-bold opacity-40 uppercase tracking-widest"><span>${s.name}</span><span>${p}%</span></div>
                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden"><div class="bg-blue-600 h-full" style="width:${p}%"></div></div></div>`;
            }).join('');
        }

        function updateBudget() { localStorage.setItem('userBudget', document.getElementById('budgetInput').value); displaySubs(); }
        function changeCurrency() { localStorage.setItem('userCurrency', document.getElementById('currencySelect').value); displaySubs(); }

        window.onload = () => displaySubs();
    </script>
</body>
</html>
