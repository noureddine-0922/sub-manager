<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير اشتراكاتي | Sub Manager</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
        .sub-card:hover .delete-btn { opacity: 1; }
    </style>
</head>
<body class="p-5 pb-20">
    <div class="max-w-md mx-auto">
        
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black text-blue-600">اشتراكاتي</h1>
            <div class="mt-4 bg-white p-6 rounded-3xl shadow-sm border border-blue-100">
                <p class="text-gray-500 text-sm font-medium">إجمالي المصاريف الشهرية</p>
                <h2 id="totalDisplay" class="text-3xl font-black text-blue-800 mt-1">0</h2>
            </div>
        </header>

        <div class="mb-6 flex gap-2">
            <div class="flex-1 bg-white p-3 rounded-2xl shadow-sm flex items-center justify-between">
                <label class="text-xs font-bold text-gray-400">العملة</label>
                <select id="currencySelect" onchange="changeCurrency()" class="bg-transparent font-bold text-sm outline-none">
                    <option value="ريال">SAR</option>
                    <option value="$">USD</option>
                    <option value="درهم">AED</option>
                    <option value="د.ك">KWD</option>
                    <option value="€">EUR</option>
                </select>
            </div>
            <button onclick="exportData()" class="bg-white p-3 rounded-2xl shadow-sm text-xs font-bold text-gray-500 hover:bg-gray-50">
                حفظ نسخة 💾
            </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md mb-8">
            <h2 class="font-bold mb-4 text-gray-700">إضافة اشتراك جديد</h2>
            <div class="space-y-3">
                <input type="text" id="subName" placeholder="اسم الخدمة (مثلاً: نيتفلكس)" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                <input type="number" id="subPrice" placeholder="السعر" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                <input type="date" id="subDate" class="w-full p-3 bg-gray-50 border-none rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                <button onclick="saveSub()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 active:scale-95">
                    إضافة للقائمة
                </button>
            </div>
        </div>

        <div id="subList" class="space-y-4">
            </div>

    </div>

    <script>
        // دالة حساب الأيام
        function getDaysLeft(date) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(date);
            const diff = target - today;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function changeCurrency() {
            localStorage.setItem('userCurrency', document.getElementById('currencySelect').value);
            displaySubs();
        }

        function deleteSub(index) {
            if(confirm('هل تريد حذف هذا الاشتراك؟')) {
                let subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
                subs.splice(index, 1);
                localStorage.setItem('mySubs', JSON.stringify(subs));
                displaySubs();
            }
        }

        function displaySubs() {
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            const currency = localStorage.getItem('userCurrency') || 'ريال';
            document.getElementById('currencySelect').value = currency;
            
            const listDiv = document.getElementById('subList');
            const totalDisplay = document.getElementById('totalDisplay');
            listDiv.innerHTML = '';
            
            let total = 0;

            subs.sort((a, b) => new Date(a.date) - new Date(b.date)); // ترتيب حسب الأقرب تاريخاً

            subs.forEach((sub, index) => {
                total += parseFloat(sub.price);
                const days = getDaysLeft(sub.date);
                
                let statusText = `باقي ${days} يوم`;
                let badgeClass = "bg-green-100 text-green-600";
                
                if (days === 0) { statusText = "يستحق اليوم ⚠️"; badgeClass = "bg-orange-100 text-orange-600"; }
                else if (days < 0) { statusText = "منتهي"; badgeClass = "bg-red-100 text-red-600"; }
                else if (days <= 3) { badgeClass = "bg-red-100 text-red-600"; }

                listDiv.innerHTML += `
                    <div class="sub-card bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-transparent hover:border-blue-200 transition-all">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${sub.name}</h3>
                            <p class="text-sm font-medium text-blue-600">${sub.price} ${currency}</p>
                        </div>
                        <div class="text-center px-2">
                            <span class="text-[10px] font-bold px-3 py-1 rounded-full ${badgeClass}">
                                ${statusText}
                            </span>
                        </div>
                        <button onclick="deleteSub(${index})" class="delete-btn p-2 text-gray-300 hover:text-red-500 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
            });

            totalDisplay.innerText = `${total.toLocaleString()} ${currency}`;
        }

        function saveSub() {
            const name = document.getElementById('subName').value;
            const price = document.getElementById('subPrice').value;
            const date = document.getElementById('subDate').value;

            if(!name || !price || !date) return alert("الرجاء إكمال البيانات");

            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            subs.push({ name, price, date });
            localStorage.setItem('mySubs', JSON.stringify(subs));
            
            displaySubs();
            document.getElementById('subName').value = '';
            document.getElementById('subPrice').value = '';
            document.getElementById('subDate').value = '';
        }

        // ميزة تحميل نسخة احتياطية
        function exportData() {
            const data = localStorage.getItem('mySubs');
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my-subscriptions.json';
            a.click();
        }

        displaySubs();
    </script>
</body>
</html>
