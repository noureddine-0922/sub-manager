<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white">

    <div class="max-w-md mx-auto min-h-screen flex flex-col">
        <header class="p-6 bg-slate-800 shadow-xl rounded-b-3xl text-center">
            <h1 class="text-2xl font-bold">Sub Manager 🚀</h1>
            <p id="currentDate" class="text-slate-400 text-xs mt-1"></p>
        </header>

        <nav class="flex justify-around bg-slate-800 mt-4 mx-4 rounded-xl p-2 shadow-lg border border-slate-700">
            <button onclick="openTab('dashboard')" class="tab-link active-tab px-4 py-2 rounded-lg transition-all">الرئيسية</button>
            <button onclick="openTab('subs')" class="tab-link px-4 py-2 rounded-lg transition-all">الاشتراكات</button>
            <button onclick="openTab('cemetery')" class="tab-link px-4 py-2 rounded-lg transition-all text-red-400">المقبرة ⚰️</button>
        </nav>

        <section id="dashboard" class="tab-content active p-6">
            <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-3xl shadow-2xl mb-6">
                <p class="text-indigo-100 text-sm">إجمالي المصاريف الشهرية</p>
                <h2 class="text-4xl font-bold mt-2" id="totalMonthly">0.00 ريال</h2>
            </div>

            <div id="smartAlert" class="hidden bg-slate-800 p-4 rounded-2xl mb-4 border-l-4 border-amber-400 animate-pulse">
                <h3 class="text-amber-400 font-bold mb-1">💡 توفير ذكي</h3>
                <p id="alertMessage" class="text-sm text-slate-300"></p>
            </div>
        </section>

        <section id="subs" class="tab-content p-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">اشتراكاتك النشطة</h3>
                <button onclick="addNewSubPrompt()" class="bg-indigo-600 p-2 px-4 rounded-xl hover:bg-indigo-500 text-sm">إضافة +</button>
            </div>
            <div id="subsList" class="space-y-4">
                </div>
        </section>

        <section id="cemetery" class="tab-content p-6 hidden">
            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-dashed border-slate-700 text-center mb-6">
                <p class="text-slate-400">إجمالي ما قمت بتوفيره حتى الآن</p>
                <h2 class="text-3xl font-bold text-green-400 mt-2" id="totalSaved">0.00 $</h2>
            </div>
            <div id="archivedList" class="space-y-4 opacity-60 grayscale">
                </div>
        </section>

        <footer class="mt-auto p-6 text-center text-slate-600 text-[10px]">
            Sub Manager v1.0 - 2026 | Powered by NXR & AI
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
