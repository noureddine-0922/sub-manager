<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Manager</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; }
        .dark-mode { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { background-color: var(--bg); color: var(--text); transition: all 0.3s ease; }
        .glass-header { 
            background: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=500&q=80');
            background-size: cover; background-position: center;
        }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="pb-24">

    <div class="glass-header h-48 w-full relative flex items-center justify-center text-white p-6 shadow-lg">
        <div class="absolute inset-0 bg-blue-900/40 backdrop-blur-[2px]"></div>
        <div class="relative text-center">
            <h1 class="text-3xl font-black mb-2">اشتراكاتي</h1>
            <div class="bg-white/20 backdrop-blur-md p-4 rounded-2xl border border-white/30">
                <p class="text-xs opacity-80">إجمالي المصاريف</p>
                <h2 id="totalDisplay" class="text-2xl font-bold">0</h2>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-5 -mt-8 relative z-10">
        
        <div class="flex gap-2 mb-4">
            <select id="currencySelect" onchange="changeCurrency()" class="flex-1 p-3 rounded-xl bg-[var(--card)] shadow-sm outline-none font-bold text-sm">
                <option value="ريال">SAR (ريال)</option>
                <option value="$">USD ($)</option>
                <option value="€">EUR (€)</option>
            </select>
            <button onclick="exportData()" class="p-3 rounded-xl bg-[var(--card)] shadow-sm">💾</button>
        </div>

        <div class="bg-[var(--card)] p-6 rounded-3xl shadow-xl space-y-3">
            <input type="text" id="subName" placeholder="اسم الخدمة" class="w-full p-3 bg-gray-100/50 rounded-xl outline-none border-none dark:text-gray-800">
            <input type="number" id="subPrice" placeholder="السعر" class="w-full p-3 bg-gray-100/50 rounded-xl outline-none border-none dark:text-gray-800">
            <input type="date" id="subDate" class="w-full p-3 bg-gray-100/50 rounded-xl outline-none border-none dark:text-gray-800">
            <button onclick="openNotificationModal()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30">إضافة للقائمة</button>
        </div>

        <div id="subList" class="mt-8 space-y-4"></div>
    </div>

    <div id="notifModal" class="modal">
        <div class="bg-white p-6 rounded-3xl max-w-xs w-full text-center mx-4 shadow-2xl">
            <h3 class="font-bold text-gray-800 mb-2">ضبط التنبيه 🔔</h3>
            <p class="text-xs text-gray-500 mb-4">متى تريدنا أن ننبهك قبل موعد الخصم؟</p>
            <div class="grid grid-cols-2 gap-2 mb-6 text-gray-800">
                <button onclick="selectNotif(15)" class="notif-opt p-2 border rounded-lg text-sm hover:bg-blue-50">15 يوم</button>
                <button onclick="selectNotif(7)" class="notif-opt p-2 border rounded-lg text-sm hover:bg-blue-50">7 أيام</button>
                <button onclick="selectNotif(5)" class="notif-opt p-2 border rounded-lg text-sm hover:bg-blue-50">5 أيام</button>
                <button onclick="selectNotif(2)" class="notif-opt p-2 border rounded-lg text-sm hover:bg-blue-50">يومين</button>
            </div>
            <button onclick="confirmAndSave()" class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold">تأكيد وحفظ</button>
            <button onclick="closeModal()" class="mt-2 text-xs text-gray-400">إلغاء</button>
        </div>
    </div>

    <button onclick="toggleDarkMode()" class="fixed bottom-6 left-6 w-14 h-14 bg-blue-600 rounded-full shadow-2xl flex items-center justify-center text-2xl z-50 animate-bounce">
        <span id="themeIcon">🌙</span>
    </button>

    <script>
        let selectedDays = 2;

        // تبديل الوضع الليلي
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // إرسال إشعار حقيقي
        function sendNotification(title, body) {
            if (Notification.permission === "granted") {
                new Notification(title, { body, icon: "icon.png" });
            }
        }

        function openNotificationModal() {
            if(!document.getElementById('subName').value) return alert("أدخل البيانات أولاً");
            Notification.requestPermission().then(perm => {
                document.getElementById('notifModal').classList.add('active');
            });
        }

        function selectNotif(days) {
            selectedDays = days;
            document.querySelectorAll('.notif-opt').forEach(btn => btn.classList.remove('bg-blue-100', 'border-blue-500'));
            event.target.classList.add('bg-blue-100', 'border-blue-500');
        }

        function closeModal() { document.getElementById('notifModal').classList.remove('active'); }

        function confirmAndSave() {
            const name = document.getElementById('subName').value;
            const price = document.getElementById('subPrice').value;
            const date = document.getElementById('subDate').value;
            
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            subs.push({ name, price, date, remindBefore: selectedDays });
            localStorage.setItem('mySubs', JSON.stringify(subs));
            
            closeModal();
            displaySubs();
            sendNotification("تم الإضافة بنجاح", `سنقوم بتنبيهك قبل ${selectedDays} أيام من موعد ${name}`);
            
            // تفريغ الحقول
            document.getElementById('subName').value = '';
            document.getElementById('subPrice').value = '';
            document.getElementById('subDate').value = '';
        }

        function displaySubs() {
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            const currency = localStorage.getItem('userCurrency') || 'ريال';
            const listDiv = document.getElementById('subList');
            let total = 0;
            listDiv.innerHTML = '';

            subs.forEach((sub, index) => {
                total += parseFloat(sub.price);
                const diff = Math.ceil((new Date(sub.date) - new Date()) / (1000 * 60 * 60 * 24));
                
                listDiv.innerHTML += `
                    <div class="bg-[var(--card)] p-4 rounded-2xl shadow-sm flex justify-between items-center">
                        <div>
                            <h3 class="font-bold">${sub.name}</h3>
                            <p class="text-xs opacity-60">${sub.price} ${currency}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] px-2 py-1 rounded-lg ${diff <= 3 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                                باقي ${diff} يوم
                            </span>
                            <button onclick="deleteSub(${index})" class="text-gray-300">🗑️</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('totalDisplay').innerText = `${total} ${currency}`;
        }

        function deleteSub(i) {
            let subs = JSON.parse(localStorage.getItem('mySubs'));
            subs.splice(i, 1);
            localStorage.setItem('mySubs', JSON.stringify(subs));
            displaySubs();
        }

        function changeCurrency() {
            localStorage.setItem('userCurrency', document.getElementById('currencySelect').value);
            displaySubs();
        }

        // استعادة الوضع الليلي المحفوظ
        if(localStorage.getItem('theme') === 'dark') toggleDarkMode();
        displaySubs();
    </script>
</body>
</html>
