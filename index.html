<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(45deg, #0f172a, #1e1b4b, #312e81);
            background-attachment: fixed;
            color: white; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية التطبيق الرئيسية */
        #app-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }

        /* تأثير الغشاوة (الضباب) عند فتح النافذة */
        .modal-open #app-container {
            filter: blur(15px) brightness(0.6);
            transform: scale(0.95);
            pointer-events: none;
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .credit-card { 
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.3), rgba(30, 58, 138, 0.5));
            border: 1px solid rgba(255,255,255,0.15);
        }

        .drawer { 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateX(100%); 
            position: fixed; 
            top: 0; right: 0; bottom: 0; 
            width: 80%; max-width: 300px; 
            z-index: 2000; 
        }
        .drawer.active { transform: translateX(0); }

        .overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.5); 
            z-index: 1500; 
            backdrop-filter: blur(4px);
        }
        .overlay.active { display: block; }

        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .modal.active { display: flex; }
    </style>
</head>
<body class="pb-10">

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="app-container">
        <div class="p-6 flex justify-between items-center relative z-10">
            <button onclick="toggleDrawer()" class="p-3 glass-panel rounded-2xl active:scale-90 transition">
                <img src="https://cdn-icons-png.flaticon.com/512/8166/8166544.png" class="w-6 h-6 invert">
            </button>
            <h1 class="text-xl font-black tracking-widest text-blue-400">SUB MANAGER</h1>
            <div class="w-10"></div>
        </div>

        <div class="max-w-md mx-auto px-6">
            <div class="credit-card rounded-[2.5rem] p-8 text-white mb-8 relative overflow-hidden shadow-2xl">
                <div class="flex justify-between items-start mb-10">
                    <div>
                        <p class="text-blue-300 text-[10px] font-bold mb-1 uppercase tracking-widest">إجمالي المصاريف الشهرية</p>
                        <h2 id="totalDisplay" class="text-4xl font-black">0 SAR</h2>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/9334/9334611.png" class="w-12 opacity-80">
                </div>
                <div class="flex justify-between items-end">
                    <p class="text-xs font-bold opacity-60 tracking-widest uppercase">Sub Manager Beta</p>
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-orange-500/80 border border-white/10"></div>
                        <div class="w-8 h-8 rounded-full bg-red-600/80 border border-white/10"></div>
                    </div>
                </div>
            </div>

            <div id="subList" class="space-y-4"></div>
        </div>
    </div>

    <div id="drawer" class="drawer glass-panel p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-xl font-black text-blue-400">التنقل</h2>
            <button onclick="toggleDrawer()" class="text-2xl opacity-40">×</button>
        </div>
        <nav class="space-y-3">
            <button onclick="toggleDrawer()" class="w-full flex items-center gap-4 p-4 rounded-2xl bg-white/5 font-bold text-right">
                <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png" class="w-5 h-5 invert"> الرئيسية
            </button>
            <button onclick="openModal()" class="w-full flex items-center gap-4 p-4 rounded-2xl bg-blue-600/20 text-blue-400 font-bold text-right">
                <img src="https://cdn-icons-png.flaticon.com/512/4315/4315609.png" class="w-5 h-5 invert"> إضافة اشتراك
            </button>
            <div class="pt-6 mt-6 border-t border-white/5">
                <button onclick="exportData()" class="w-full flex items-center justify-center gap-2 p-4 rounded-xl text-xs text-gray-500 bg-white/5">
                    <img src="https://cdn-icons-png.flaticon.com/512/2874/2874091.png" class="w-4 h-4 invert opacity-40"> حفظ نسخة احتياطية
                </button>
            </div>
        </nav>
    </div>

    <div id="addModal" class="modal">
        <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 relative border border-white/20 shadow-2xl">
            <div class="text-center mb-6">
                <div id="logoPreview" class="w-20 h-20 mx-auto bg-white/5 rounded-3xl flex items-center justify-center mb-4 text-3xl font-black border border-white/10">+</div>
                <h3 class="text-xl font-black">إضافة اشتراك جديد</h3>
            </div>
            <div class="space-y-4">
                <input type="text" id="subName" oninput="updateLogoPreview(this.value)" placeholder="اسم الخدمة (مثل Netflix)" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none text-white focus:border-blue-500">
                <div class="flex gap-2">
                    <input type="number" id="subPrice" placeholder="السعر" class="flex-1 p-4 rounded-2xl bg-white/5 border border-white/10 outline-none text-white focus:border-blue-500">
                    <select id="subType" class="bg-white/10 border border-white/10 p-4 rounded-2xl text-xs font-bold outline-none text-white">
                        <option value="monthly" class="text-black">شهري</option>
                        <option value="annual" class="text-black">سنوي</option>
                    </select>
                </div>
                <input type="date" id="subDate" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none text-white">
                <button onclick="saveSub()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-600/30 active:scale-95 transition-all">حفظ الاشتراك</button>
                <button onclick="closeModal()" class="w-full text-gray-500 font-bold text-sm mt-2">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const knownLogos = {
          'netflix': 'https://cdn-icons-png.flaticon.com/512/5977/5977590.png',
            'spotify': 'https://cdn-icons-png.flaticon.com/512/2111/2111624.png',
            'tiktok': 'https://cdn-icons-png.flaticon.com/512/3046/3046121.png',
            'youtube': 'https://cdn-icons-png.flaticon.com/512/174/174883.png',
            'apple': 'https://img.icons8.com/?size=48&id=81TSi6Gqk0tm&format=png',
            'amazon': 'https://cdn-icons-png.flaticon.com/512/5968/5968202.png',
            'discord': 'https://cdn-icons-png.flaticon.com/128/3670/3670157.png',
            'snapchat': 'https://cdn-icons-png.flaticon.com/128/15707/15707784.png',
            'chatgpt': 'https://cdn-icons-png.flaticon.com/128/12222/12222560.png',
            'gemini': 'https://img.icons8.com/?size=48&id=mrNoLXFmvXDX&format=png',
            'claude': 'https://img.icons8.com/?size=48&id=zQjzFjPpT2Ek&format=png',
            'amazone prime': 'https://img.icons8.com/?size=48&id=EHtqS186HLz5&format=png',
            'amazon prime video': 'https://img.icons8.com/?size=48&id=mJTj7Q9EPSVn&format=png',
            'disney': 'https://img.icons8.com/?size=48&id=o7YMV0TFYOgR&format=png',
            'cloudflare': 'https://img.icons8.com/?size=80&id=fUGx53gD9Jof&format=png',
            'adobe creative cloud': 'https://img.icons8.com/?size=48&id=Lq5kMukvoW5c&format=png',
            'crunchyroll': 'https://img.icons8.com/?size=48&id=zoSCFf_pSWUE&format=png',
            'deezer': 'https://cdn-icons-png.flaticon.com/128/5968/5968821.png',
            'hbo max': 'https://img.icons8.com/?size=50&id=9tVdlpWe1F9k&format=png',
            'dropbox': 'https://img.icons8.com/?size=48&id=13657&format=png',
            'duolingo': 'https://img.icons8.com/?size=48&id=jJS472JMXlsE&format=png',
            'rave': 'https://img.icons8.com/?size=50&id=FDehNjzhkWzO&format=png',
            'kick': 'https://pnghdpro.com/wp-content/themes/pnghdpro/download/social-media-and-brands/kick-app-icon.png',
            'nord vpn': 'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/nordvpn-icon.png',
            'perplexity': 'https://img.icons8.com/?size=50&id=5WrDC03cg9ua&format=png',
            'express vpn': 'https://img.icons8.com/?size=48&id=EYvWm4GHpQwc&format=png'
        };

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function openModal() {
            document.body.classList.add('modal-open');
            document.getElementById('addModal').classList.add('active');
            document.getElementById('drawer').classList.remove('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeModal() {
            document.body.classList.remove('modal-open');
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function closeAll() {
            closeModal();
            document.getElementById('drawer').classList.remove('active');
        }

        function updateLogoPreview(val) {
            const preview = document.getElementById('logoPreview');
            const clean = val.toLowerCase().trim();
            if (knownLogos[clean]) {
                preview.innerHTML = `<img src="${knownLogos[clean]}" class="w-full h-full object-contain p-3">`;
            } else {
                preview.innerText = val ? val.charAt(0).toUpperCase() : "+";
            }
        }

        function displaySubs() {
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            const listDiv = document.getElementById('subList');
            let total = 0;
            listDiv.innerHTML = '';

            subs.forEach((sub, index) => {
                const monthlyPrice = sub.type === 'annual' ? (sub.price / 12) : parseFloat(sub.price);
                total += monthlyPrice;
                const logo = knownLogos[sub.name.toLowerCase().trim()];
                
                listDiv.innerHTML += `
                    <div class="glass-panel p-5 rounded-[2.2rem] flex justify-between items-center transition-all hover:scale-[1.02]">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-3xl bg-white/5 flex items-center justify-center p-3">
                                ${logo ? `<img src="${logo}" class="w-full h-full object-contain">` : `<span class="text-xl font-black opacity-30">${sub.name.charAt(0)}</span>`}
                            </div>
                            <div>
                                <h4 class="font-bold text-white">${sub.name}</h4>
                                <p class="text-[10px] font-black text-blue-400">${monthlyPrice.toFixed(2)} SAR / شهر</p>
                            </div>
                        </div>
                        <button onclick="deleteSub(${index})" class="p-3 bg-red-500/10 rounded-2xl active:scale-90">
                            <img src="https://cdn-icons-png.flaticon.com/512/6861/6861362.png" class="w-4 h-4 invert opacity-30">
                        </button>
                    </div>`;
            });
            document.getElementById('totalDisplay').innerText = `${total.toFixed(2)} SAR`;
        }

        function saveSub() {
            const name = document.getElementById('subName').value;
            const price = document.getElementById('subPrice').value;
            const date = document.getElementById('subDate').value;
            const type = document.getElementById('subType').value;
            if(!name || !price || !date) return alert("البيانات ناقصة!");
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            subs.push({ name, price, date, type });
            localStorage.setItem('mySubs', JSON.stringify(subs));
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            closeModal();
            displaySubs();
        }

        function deleteSub(i) {
            let subs = JSON.parse(localStorage.getItem('mySubs'));
            subs.splice(i, 1);
            localStorage.setItem('mySubs', JSON.stringify(subs));
            displaySubs();
        }

        function exportData() {
            const data = localStorage.getItem('mySubs');
            if(!data) return alert("لا توجد بيانات!");
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup.json`;
            a.click();
        }

        displaySubs();
    </script>
</body>
</html>
