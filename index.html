<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Manager Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .dark-mode { background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark-mode .glass { background: rgba(30, 41, 59, 0.7); border-color: rgba(255,255,255,0.1); }
        .credit-card { 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .drawer { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
        .drawer.active { transform: translateX(0); }
        .sub-item { transition: all 0.3s ease; }
        .sub-item.deleting { transform: translateX(-100%); opacity: 0; }
    </style>
</head>
<body class="min-h-screen">

    <div class="p-5 flex justify-between items-center relative z-20">
        <button onclick="toggleDrawer()" class="p-2 bg-white dark:bg-slate-800 rounded-lg shadow-sm">
            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828859.png" class="w-6 h-6" alt="menu">
        </button>
        <h1 class="text-xl font-bold dark:text-white">Sub Manager</h1>
        <div class="w-10"></div> </div>

    <div class="max-w-md mx-auto px-5">
        <div class="credit-card rounded-[2rem] p-8 text-white mb-10 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16"></div>
            <div class="flex justify-between items-start mb-12">
                <div>
                    <p class="text-xs opacity-70 mb-1 font-medium">إجمالي اشتراكاتك</p>
                    <h2 id="totalDisplay" class="text-3xl font-bold tracking-tight">0 SAR</h2>
                </div>
                <img src="https://cdn-icons-png.flaticon.com/512/6404/6404100.png" class="w-12 opacity-50">
            </div>
            <div class="flex justify-between items-end">
                <p class="text-sm font-mono tracking-widest uppercase">Premium User</p>
                <div class="flex -space-x-3">
                    <div class="w-8 h-8 rounded-full bg-yellow-400 opacity-80"></div>
                    <div class="w-8 h-8 rounded-full bg-red-500 opacity-80"></div>
                </div>
            </div>
        </div>

        <div id="subList" class="space-y-4"></div>
    </div>

    <div id="drawer" class="fixed inset-y-0 right-0 w-64 bg-white dark:bg-slate-900 z-50 shadow-2xl drawer p-6">
        <button onclick="toggleDrawer()" class="mb-10 text-gray-400 font-bold">إغلاق ×</button>
        <nav class="space-y-6">
            <a href="#" class="flex items-center gap-4 text-blue-600 font-bold"><span class="text-xl">🏠</span> الرئيسية</a>
            <button onclick="openModal()" class="flex items-center gap-4 text-gray-500"><span class="text-xl">➕</span> إضافة جديد</button>
            <a href="#" class="flex items-center gap-4 text-gray-500"><span class="text-xl">📊</span> الإحصائيات</a>
            <button onclick="toggleDarkMode()" class="flex items-center gap-4 text-gray-500"><span class="text-xl text-yellow-500" id="themeIcon">🌙</span> الوضع الليلي</button>
        </nav>
    </div>

    <div id="addModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-5">
        <div class="glass w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-xl font-bold mb-6 text-center">اشتراك جديد</h3>
            <div class="space-y-4">
                <input type="text" id="subName" placeholder="الاسم (Netflix, Spotify...)" class="w-full p-4 rounded-2xl bg-white/50 border-none outline-none focus:ring-2 focus:ring-blue-400">
                <input type="number" id="subPrice" placeholder="السعر" class="w-full p-4 rounded-2xl bg-white/50 border-none outline-none focus:ring-2 focus:ring-blue-400">
                <input type="date" id="subDate" class="w-full p-4 rounded-2xl bg-white/50 border-none outline-none focus:ring-2 focus:ring-blue-400">
                <button onclick="saveSub()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">حفظ الآن</button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-sm">تراجع</button>
            </div>
        </div>
    </div>

    <script>
        function toggleDrawer() { document.getElementById('drawer').classList.toggle('active'); }
        function openModal() { document.getElementById('addModal').style.display = 'flex'; toggleDrawer(); }
        function closeModal() { document.getElementById('addModal').style.display = 'none'; }
        
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
        }

        // دالة جلب اللوجو التلقائي
        function getLogo(name) {
            const cleanName = name.toLowerCase().trim();
            return `https://logo.clearbit.com/${cleanName}.com?size=100`;
        }

        function displaySubs() {
            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            const listDiv = document.getElementById('subList');
            let total = 0;
            listDiv.innerHTML = '';

            subs.forEach((sub, index) => {
                total += parseFloat(sub.price);
                const logoUrl = getLogo(sub.name);
                
                listDiv.innerHTML += `
                    <div id="item-${index}" class="sub-item glass p-4 rounded-3xl flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl overflow-hidden bg-white flex items-center justify-center border shadow-sm">
                                <img src="${logoUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1048/1048953.png'" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h4 class="font-bold text-sm">${sub.name}</h4>
                                <p class="text-xs text-blue-500 font-bold">${sub.price} SAR</p>
                            </div>
                        </div>
                        <button onclick="deleteWithAnim(${index})" class="text-red-300 hover:text-red-500 p-2">🗑️</button>
                    </div>
                `;
            });
            document.getElementById('totalDisplay').innerText = `${total.toLocaleString()} SAR`;
        }

        function saveSub() {
            const name = document.getElementById('subName').value;
            const price = document.getElementById('subPrice').value;
            const date = document.getElementById('subDate').value;

            if(!name || !price || !date) return;

            const subs = JSON.parse(localStorage.getItem('mySubs') || '[]');
            subs.push({ name, price, date });
            localStorage.setItem('mySubs', JSON.stringify(subs));
            
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            closeModal();
            displaySubs();
        }

        function deleteWithAnim(index) {
            const el = document.getElementById(`item-${index}`);
            el.classList.add('deleting');
            setTimeout(() => {
                let subs = JSON.parse(localStorage.getItem('mySubs'));
                subs.splice(index, 1);
                localStorage.setItem('mySubs', JSON.stringify(subs));
                displaySubs();
            }, 300);
        }

        displaySubs();
    </script>
</body>
</html>
